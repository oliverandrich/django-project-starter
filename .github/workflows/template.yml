name: Template

# Tests this template repository. It stays outside template/, so no project receives it.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Test generation
        run: mise run test-template

  generated-project:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Every answer combination would be 32 jobs. These cover all on, all off and each part alone.
      matrix:
        include:
          - { live_updates: true, background_tasks: true, login: '["password","microsoft","magic_link"]' }
          - { live_updates: false, background_tasks: false, login: "[]" }
          - { live_updates: true, background_tasks: false, login: "[]" }
          - { live_updates: false, background_tasks: true, login: "[]" }
          - { live_updates: false, background_tasks: false, login: '["password"]' }
          - { live_updates: false, background_tasks: false, login: '["microsoft","magic_link"]' }
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Mirrors ci.yml, which runs without the .env that bootstrap writes. DATABASE_URL names a
    # database that does not exist yet, so bootstrap's createdb has something to create.
    env:
      SECRET_KEY: ci-only-not-secret
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/acme_shop
      # As ci.yml sets them with the Microsoft login. Other projects ignore them.
      ENTRA_TENANT_ID: 00000000-0000-0000-0000-000000000000
      ENTRA_CLIENT_ID: 00000000-0000-0000-0000-000000000000
    defaults:
      run:
        working-directory: acme_shop
    steps:
      # Template and project side by side, so the trust mise-action grants covers both.
      - uses: actions/checkout@v7
        with:
          path: template
      - uses: jdx/mise-action@v5
        with:
          working_directory: template
          env: false
      # Bootstrap writes uv.lock, so the keys hash the template's inputs instead.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/uv
            ~/.cache/pre-commit
          key: generated-${{ hashFiles('template/template/pyproject.toml.jinja', 'template/template/.pre-commit-config.yaml') }}
      # Run inside the template, whose mise.toml resolves the python shim.
      - name: Generate a project from this checkout
        working-directory: template
        run: >-
          uvx copier copy --defaults --vcs-ref HEAD
          --data project_name=acme_shop --data live_updates=${{ matrix.live_updates }}
          --data background_tasks=${{ matrix.background_tasks }}
          --data 'login=${{ matrix.login }}'
          . ../acme_shop
      - name: Bootstrap
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
          mise run bootstrap
          rm .env
      - name: Lint
        run: mise run lint
      - name: Test
        run: mise run test
