# Copier renders only files ending in .jinja. Django templates keep their own {{ }} and {% %}.
_templates_suffix: .jinja
# The project lives in template/; this repository's tests, CI and docs stay behind.
_subdirectory: template
# The README describes the project from its first commit on; updates leave it alone.
_skip_if_exists:
  - README.md
_min_copier_version: "9.4"
# A line holding only a block tag such as {% if %} disappears from the output.
_envops:
  keep_trailing_newline: true
  trim_blocks: true
  lstrip_blocks: true

project_name:
  type: str
  help: Python package name of the project, such as acme_shop
  validator: >-
    {% if not (project_name | regex_search('^[a-z][a-z0-9_]*$')) %}
    Use lowercase letters, digits and underscores, starting with a letter.
    {% endif %}

background_tasks:
  type: bool
  help: Background tasks with django-tasks-db, a worker and a cron scheduler (django-crontask)?
  default: true

login:
  type: str
  help: Login methods for the site's users (none keeps only the admin login)
  multiselect: true
  choices:
    Password, through Django's own login view: password
    Microsoft Entra ID for internal users (django-auth-adfs): microsoft
    Single-use link by email for customers the team creates (django-sesame): magic_link
  default: []

live_updates:
  type: bool
  help: Live updates with django-pg-sse (server-sent events over PostgreSQL LISTEN/NOTIFY)?
  default: true
