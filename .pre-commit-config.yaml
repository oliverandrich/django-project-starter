default_language_version:
  python: python3.14

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      - id: check-json

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # v0.12.0 or newer: the `ruff-check` hook id below does not exist in v0.9.x, where it was
    # still called `ruff`, so the pinned pair here never ran.
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/adamchainz/django-upgrade
    # 1.31.0 or newer: earlier releases do not know --target-version 6.1. The pinned revision is
    # what pre-commit runs, so checking `uvx django-upgrade --help` says nothing about this.
    rev: 1.33.0
    hooks:
      - id: django-upgrade
        args: [--target-version, "6.1"]

  - repo: local
    hooks:
      # Runs from the project venv, so it sees the installed packages and the version uv.lock pins.
      - id: basedpyright
        name: basedpyright
        entry: uv run basedpyright
        language: system
        types_or: [python, pyi]
        pass_filenames: false

  - repo: https://github.com/adamchainz/djade-pre-commit
    rev: "1.9.0"
    hooks:
      - id: djade
        # 6.0, not 6.1: djade's newest known target is 6.0. Not a forgotten pin -- raise it when
        # djade learns 6.1.
        args: [--target-version, "6.0"]
