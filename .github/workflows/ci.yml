name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # A fresh checkout has no .env, and the settings refuse an empty key outside DEBUG.
      SECRET_KEY: ci-only-not-secret
    steps:
      - uses: actions/checkout@v7
      # Python and uv only: tmux serves `mise run dev` and is not needed here.
      - uses: jdx/mise-action@v5
        with:
          install_args: python uv
      - uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ hashFiles('uv.lock') }}
      - name: Install dependencies
        run: uv sync --frozen --all-extras --python "$(mise which python)"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Lint
        run: mise run lint
      - name: Test
        run: mise run test
      - name: Prune the uv cache
        run: uv cache prune --ci

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          file: docker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
