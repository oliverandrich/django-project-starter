# Copier renders only files ending in .jinja. Django templates keep their own {{ }} and {% %}.
_templates_suffix: .jinja
# The project lives in template/; this repository's tests, CI and docs stay behind.
_subdirectory: template
# The README describes the project from its first commit on; updates leave it alone.
_skip_if_exists:
  - README.md
_min_copier_version: "9.4"
# Adds the SPDX marker of the chosen license to every source file. copier copy needs --trust.
_tasks:
  - command: [".mise/tasks/license", "--fix"]
    when: "{{ license != 'proprietary' }}"
# A line holding only a block tag such as {% if %} disappears from the output.
_envops:
  keep_trailing_newline: true
  trim_blocks: true
  lstrip_blocks: true

project_name:
  type: str
  help: Python package name of the project, such as acme_shop
  validator: >-
    {% if not (project_name | regex_search('^[a-z][a-z0-9_]*$')) %}
    Use lowercase letters, digits and underscores, starting with a letter.
    {% endif %}

database:
  type: str
  help: Database of the project
  choices:
    PostgreSQL through psycopg 3: postgresql
    SQLite through dj-lite, for a single server: sqlite
  default: postgresql

background_tasks:
  type: bool
  help: Background tasks with django-tasks-db, a worker and a cron scheduler (django-crontask)?
  default: true

login:
  type: str
  help: Login methods for the site's users (none keeps only the admin login)
  multiselect: true
  choices:
    Password, through Django's own login view: password
    Microsoft Entra ID for internal users (django-auth-adfs): microsoft
    Single-use link by email for customers the team creates (django-sesame): magic_link
  default: []

docker:
  type: bool
  help: A Docker image with an entrypoint for the web server, worker and scheduler, built in CI?
  default: true

# Computed, never asked and not stored: login methods that mail links need the public origin.
site_url:
  type: bool
  when: false
  default: "{{ 'magic_link' in login }}"

live_updates:
  type: bool
  help: Live updates with django-pg-sse (server-sent events over PostgreSQL LISTEN/NOTIFY)?
  # SQLite has no LISTEN/NOTIFY, so the question is skipped and the answer is false.
  when: "{{ database == 'postgresql' }}"
  default: "{{ database == 'postgresql' }}"
  validator: >-
    {% if live_updates and database != 'postgresql' %}
    Live updates need PostgreSQL's LISTEN/NOTIFY.
    {% endif %}

daisy_ui:
  type: bool
  help: daisyUI components on top of Tailwind CSS? The login pages use plain Tailwind either way.
  default: false

license:
  type: str
  help: License of the project
  choices:
    MIT License: MIT
    GNU Affero General Public License v3.0 or later: AGPL-3.0-or-later
    No license, proprietary: proprietary
  # Values are SPDX IDs for pyproject.toml and name the texts in licenses/.
  default: MIT

author:
  type: str
  help: Copyright holder, named in LICENSE for MIT and in README.md for the AGPL
  when: "{{ license != 'proprietary' }}"
  validator: "{% if not author.strip() %}Name the copyright holder.{% endif %}"

copyright_year:
  type: str
  help: Year of the copyright notice
  when: "{{ license != 'proprietary' }}"
  # strftime comes from the Ansible filters that Copier loads by default.
  default: "{{ '%Y' | strftime }}"
