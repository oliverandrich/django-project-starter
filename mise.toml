# The template repository's own tasks. template/mise.toml belongs to the generated project.

[tools]
python = "3.14"
uv = "latest"

[task_config]
includes = ["template_tests/tasks"]

[tasks.lint]
description = "Lint the template tests and the plain Python files under template/"
# The license task has no .py suffix, so ruff checks it only when named.
run = [
  "uvx ruff check template_tests template template/.mise/tasks/license",
  "uvx ruff format --check template_tests template template/.mise/tasks/license",
]
