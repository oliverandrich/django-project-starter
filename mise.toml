# The template repository's own tasks. template/mise.toml belongs to the generated project.

[tools]
python = "3.14"
uv = "latest"

[task_config]
includes = ["template_tests/tasks"]

[tasks.lint]
description = "Lint the template's own tests"
run = ["uvx ruff check template_tests", "uvx ruff format --check template_tests"]
