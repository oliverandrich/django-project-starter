# The template's own updates. No uv entry: uv cannot read the rendered pyproject.toml.jinja.
version: 2
updates:
  - package-ecosystem: pre-commit
    directory: /template
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directories: [/, /template]
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /template/docker
    schedule:
      interval: weekly
