[project]
name = "{{ project_name }}"
version = "0.1.0"
requires-python = ">=3.14,<4.0"
dependencies = [
  "django-browser-reload>=1.21.0",
  "django-htmx>=1.29.0",
  "django-click>=2.5.0",
  # django-click asks only for click>=7.1, and management/base.py needs 8.x for the
  # context attributes its --skip-checks option is registered on.
  "click>=8.5.0",
  "django[argon2]>=6.1.1",
  "environs[django]>=15.2.0",
  "heroicons>=2.14.0",
  "whitenoise>=6.12.0",
  "django-tailwind-cli[django-extensions]>=4.8.1",
  "dj-lite>=1.3.0",
]

[project.optional-dependencies]
granian = ["granian[pname]>=2.8.4"]

[dependency-groups]
dev = [
  "django-types>=0.24.0",
  "faker>=40.40.0",
  "ipdb>=0.13.13",
  "model-bakery>=1.24.1",
  "coverage[toml]>=7.16.2",
  "django-test-plus>=2.6.2",
  "django-rich>=2.2.0",
  "basedpyright>=1.40.2",
]

[tool.basedpyright]
include = ["{{ project_name }}", "tests"]
exclude = ["**/migrations"]
typeCheckingMode = "standard"

[tool.coverage.run]
source = ["{{ project_name }}"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if self.debug:",
  "raise NotImplementedError",
  "pass",
  "if __name__ == .__main__.:",
]
omit = ["*/migrations/*", "*/tests/*", "*/conftest.py"]

[tool.ruff]
line-length = 100

[tool.ruff.format]
exclude = ["**/migrations/*"]

# Allow unused variables when underscore-prefixed
[tool.ruff.lint]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
select = [
  "A",   # flake8-builtins
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "DJ",  # flake8-django
  "E",   # pycodestyle
  "F",   # pyflakes
  "FBT", # flake8-boolean-trap
  "N",   # pep8-naming
  "Q",   # flake8-quotes
  "TID", # flake8-tidy-imports
  "UP",  # pyupgrade
  "W",   # pycodestyle
  "YTT", # flake8-2020
]

ignore = [
  # Allow non-abstract empty methods in abstract base classes
  "B027",
  # Allow boolean positional values in function calls, like `dict.get(... True)`
  "FBT003",
  # Ignore complexity
  "C901",
]

unfixable = [
  # Don't touch unused imports
  "F401",
  # Don't touch unused variables
  "F841",
]

# Exclude a variety of commonly ignored directories
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".github",
  ".hg",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "**pypackages**",
  "_build",
  "build",
  "dist",
  "migrations",
  "node_modules",
  "static",
]

[tool.ruff.lint.isort]
known-first-party = ["{{ project_name }}"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["TID252"]
"tests.py" = ["TID252"]
