name: Template

# Tests this template repository. It stays outside template/, so no project receives it.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Test generation
        run: mise run test-template

  generated-project:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Every combination would be 256 jobs. These cover all on, all off, each part but daisy_ui alone
      # and SQLite.
      # docker stays on except in the all-off row. A string, because null == false holds in expressions.
      # daisy_ui runs only in the all-on row; it changes one setting and the body classes.
      # smoke builds the image and starts the compose example, once per database.
      matrix:
        include:
          - { live_updates: true, background_tasks: true, login: '["password","microsoft","magic_link"]', daisy_ui: true, smoke: true }
          - { live_updates: false, background_tasks: false, login: "[]", docker: "false", license: proprietary }
          - { live_updates: true, background_tasks: false, login: "[]" }
          - { live_updates: false, background_tasks: true, login: "[]", license: AGPL-3.0-or-later }
          - { live_updates: false, background_tasks: false, login: '["password"]' }
          - { live_updates: false, background_tasks: false, login: '["microsoft","magic_link"]' }
          - { database: sqlite, live_updates: false, background_tasks: true, login: '["password","magic_link"]', smoke: true }
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Mirrors ci.yml, which runs without the .env that bootstrap writes. DATABASE_URL names a
    # database that does not exist yet, so bootstrap's createdb has something to create.
    env:
      SECRET_KEY: ci-only-not-secret
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/acme_shop
    defaults:
      run:
        working-directory: acme_shop
    steps:
      # Template and project side by side, so the trust mise-action grants covers both.
      - uses: actions/checkout@v7
        with:
          path: template
      - uses: jdx/mise-action@v5
        with:
          working_directory: template
          env: false
      # Bootstrap writes uv.lock, so the keys hash the template's inputs instead.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/uv
            ~/.cache/pre-commit
          key: generated-${{ hashFiles('template/template/pyproject.toml.jinja', 'template/template/.pre-commit-config.yaml') }}
      # Run inside the template, whose mise.toml resolves the python shim.
      - name: Generate a project from this checkout
        working-directory: template
        run: >-
          uvx copier copy --trust --defaults --vcs-ref HEAD
          --data project_name=acme_shop --data live_updates=${{ matrix.live_updates }}
          --data background_tasks=${{ matrix.background_tasks }}
          ${{ matrix.database && format('--data database={0}', matrix.database) || '' }}
          --data 'login=${{ matrix.login }}'
          ${{ matrix.license && format('--data license={0}', matrix.license) || '' }}
          ${{ matrix.daisy_ui && '--data daisy_ui=true' || '' }}
          ${{ matrix.docker == 'false' && '--data docker=false' || '' }}
          --data author="Jane Doe"
          . ../acme_shop
      - name: Bootstrap
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
          mise run bootstrap
          rm .env
      - name: Lint
        run: mise run lint
      - name: Test
        run: mise run test
      # Bootstrap wrote uv.lock, which pins Playwright and with it the Chromium build.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('acme_shop/uv.lock') }}
      - name: Install Chromium
        run: uv run python -m playwright install --with-deps chromium
      - name: Browser tests
        run: mise run test-browser
      - name: Build the image
        if: matrix.smoke
        run: docker build --tag acme_shop:latest --file docker/Dockerfile .
      - name: Smoke test the compose example
        if: matrix.smoke
        run: docker/smoke-test.sh
