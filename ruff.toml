# The template tests. template/pyproject.toml.jinja configures ruff for generated projects.
line-length = 100
target-version = "py314"
# makemigrations writes them; the generated project excludes them too.
extend-exclude = ["**/migrations/*"]

[lint]
select = ["A", "B", "C4", "E", "F", "N", "Q", "TID", "UP", "W"]

# The package directory is named after the Copier question; braces are glob syntax here.
[lint.per-file-ignores]
"template/*/**/__init__.py" = ["N999"]
"template/*/__init__.py" = ["N999"]
